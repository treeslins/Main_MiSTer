name: Chinese MiSTer build
on:
  workflow_call:
    inputs:
      candidate:
        type: string
        required: true
  workflow_dispatch:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate || github.sha }}
          persist-credentials: false
      - name: Check font and upstream merge behavior
        run: |
          python3 localization/generate_font.py --check
          python3 localization/generate_catalog.py --check
          python3 tests/sync_test.py
      - name: Test pixel renderer
        run: |
          python3 tests/embed_font.py /tmp/zh-font.cpp
          g++ -std=c++14 -Wall -Wextra -fsanitize=address,undefined -I. tests/zh_render_test.cpp zh_ui.cpp zh_font.cpp /tmp/zh-font.cpp -o /tmp/zh-test
          /tmp/zh-test
      - name: Cross compile Chinese binary
        shell: bash
        run: |
          source setup_default_toolchain.sh
          make
      - uses: actions/upload-artifact@v4
        with:
          name: MiSTer-zh-CN
          path: |
            bin/MiSTer
            localization/
            LICENSE
