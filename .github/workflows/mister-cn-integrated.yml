name: MiSTer CN - complete upstream integration

on:
  schedule:
    - cron: '27 3 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/mister-cn-integrated.yml'
      - 'cn/**'
      - 'zh_*'
      - 'osd.cpp'
      - 'osd.h'
      - 'menu.cpp'
      - 'file_io.cpp'
      - 'cheats.cpp'
      - 'recent.cpp'
      - 'cfg.*'
      - 'Makefile'
      - 'localization/**'
      - 'tests/**'

permissions:
  contents: read

concurrency:
  group: mister-cn-integrated
  cancel-in-progress: false

jobs:
  build:
    name: Merge upstream, verify ZLabs font, test Chinese OSD and compile
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout integrated Chinese source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Merge current official Main_MiSTer source (fail on conflict)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags https://github.com/MiSTer-devel/Main_MiSTer.git master
          echo "UPSTREAM_SHA=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_ENV"
          echo "UPSTREAM_DATE=$(TZ=UTC git show -s --format=%cd --date=format-local:%Y.%m.%d FETCH_HEAD)" >> "$GITHUB_ENV"
          git merge --no-commit --no-ff FETCH_HEAD

      - name: Verify fixed misterfpga.cn and copy it verbatim
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          sha256sum -c cn/assets/SHA256SUMS
          python3 cn/verify_font.py --input cn/assets/misterfpga.cn --report dist/coverage.json
          cp cn/assets/misterfpga.cn dist/misterfpga.cn
          cmp cn/assets/misterfpga.cn dist/misterfpga.cn

      - name: Host-side translation, UTF-8, bounds and menu render tests
        env:
          MISTER_CN_FONT_PATH: cn/assets/misterfpga.cn
        shell: bash
        run: |
          set -euo pipefail
          python3 localization/generate_catalog.py --check
          g++ -std=gnu++14 -Wall -Wextra -I. \
            tests/zh_render_test.cpp zh_ui.cpp zh_font.cpp \
            -o /tmp/mister-cn-test
          /tmp/mister-cn-test dist/preview.pgm
          g++ -std=gnu++14 -Wall -Wextra -fsanitize=address,undefined \
            -fno-omit-frame-pointer -I. tests/zlabs_loader_test.cpp zh_font.cpp -o /tmp/zlabs-loader-test
          ASAN_OPTIONS=detect_leaks=1 /tmp/zlabs-loader-test
          ASAN_OPTIONS=detect_leaks=1 python3 tests/font_fallback_test.py /tmp/zlabs-loader-test
          g++ -std=gnu++14 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer -I. \
            tests/zh_osd_compat_test.cpp zh_ui.cpp zh_font.cpp \
            -o /tmp/mister-cn-osd-compat-test
          ASAN_OPTIONS=detect_leaks=1 /tmp/mister-cn-osd-compat-test
          g++ -std=gnu++14 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer -I. tests/zh_osd_rows_test.cpp \
            -o /tmp/mister-cn-rows-test
          ASAN_OPTIONS=detect_leaks=1 /tmp/mister-cn-rows-test
          g++ -std=gnu++14 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer -I. tests/zh_list_navigation_test.cpp \
            -o /tmp/mister-cn-list-test
          ASAN_OPTIONS=detect_leaks=1 /tmp/mister-cn-list-test

      - name: Restore cached ARM 10.2 toolchain
        id: compiler
        uses: actions/cache@v4
        with:
          path: .toolchain
          key: arm-none-linux-gnueabihf-gcc-10.2-2020.11-v1

      - name: Install matching ARM GNU cross-toolchain
        if: steps.compiler.outputs.cache-hit != 'true'
        run: |
          mkdir -p .toolchain
          curl -fL --retry 3 --retry-delay 5 \
            'https://developer.arm.com/-/media/Files/downloads/gnu-a/10.2-2020.11/binrel/gcc-arm-10.2-2020.11-x86_64-arm-none-linux-gnueabihf.tar.xz' \
            -o /tmp/arm-toolchain.tar.xz
          tar -xJf /tmp/arm-toolchain.tar.xz -C .toolchain --strip-components=1

      - name: Compile real ARM MiSTer program
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$GITHUB_WORKSPACE/.toolchain/bin:$PATH"
          make
          test -s bin/MiSTer
          arm-none-linux-gnueabihf-readelf -h bin/MiSTer | grep -q 'Machine:.*ARM'
          cp bin/MiSTer dist/MiSTer

      - name: Save reproducibility metadata and font license
        run: |
          cp cn/assets/LICENSE-OFL dist/LICENSE-OFL
          cp LICENSE dist/LICENSE-MISTER
          # Capture the exact staged upstream merge against the checked-out Chinese revision.
          git diff --cached --binary > dist/upstream-merge.patch
          {
            echo "UPSTREAM_SHA=$UPSTREAM_SHA"
            echo "UPSTREAM_DATE=$UPSTREAM_DATE"
            echo "CHINESE_SHA=$GITHUB_SHA"
            echo "FONT_SHA256=$(sha256sum cn/assets/misterfpga.cn | cut -d' ' -f1)"
            echo "FONT_REGENERATED=NO"
            echo "UPSTREAM_MERGE_PATCH_SHA256=$(sha256sum dist/upstream-merge.patch | cut -d' ' -f1)"
            ( cd dist && sha256sum MiSTer misterfpga.cn coverage.json )
          } > dist/manifest.txt

      - name: Upload successful build only
        uses: actions/upload-artifact@v4
        with:
          name: MiSTer-ZLabs-Chinese
          path: dist/
          retention-days: 30
          if-no-files-found: error

  publish:
    name: Publish dated Chinese release after successful build
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MiSTer-ZLabs-Chinese
          path: dist
      - name: Publish when upstream or Chinese source changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          up=$(sed -n 's/^UPSTREAM_SHA=//p' dist/manifest.txt)
          up_date=$(sed -n 's/^UPSTREAM_DATE=//p' dist/manifest.txt)
          cn=$(sed -n 's/^CHINESE_SHA=//p' dist/manifest.txt)
          [[ "$up" =~ ^[0-9a-f]{40}$ && "$cn" =~ ^[0-9a-f]{40}$ && "$up_date" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}$ ]]
          latest=$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name 2>/dev/null || true)
          if [[ -n "$latest" ]]; then
            mkdir -p previous-release
            gh release download "$latest" --pattern manifest.txt --dir previous-release
            old_up=$(sed -n 's/^UPSTREAM_SHA=//p' previous-release/manifest.txt)
            old_mister=$(awk '$2 == "MiSTer" { print $1 }' previous-release/manifest.txt)
            old_font=$(awk '$2 == "misterfpga.cn" { print $1 }' previous-release/manifest.txt)
            new_mister=$(sha256sum dist/MiSTer | cut -d' ' -f1)
            new_font=$(sha256sum dist/misterfpga.cn | cut -d' ' -f1)
            [[ "$old_up" =~ ^[0-9a-f]{40}$ && "$old_mister" =~ ^[0-9a-f]{64}$ && "$old_font" =~ ^[0-9a-f]{64}$ ]]
            if [[ "$up" == "$old_up" && "$new_mister" == "$old_mister" && "$new_font" == "$old_font" ]]; then
              echo "Upstream and release files unchanged since $latest; no new release."
              exit 0
            fi
          fi
          # Use the upstream commit date in UTC, not the build or workflow date.
          tag="cn-zlabs-v$up_date"
          revision=2
          while gh release view "$tag" >/dev/null 2>&1 || git ls-remote --exit-code --tags "https://github.com/$GH_REPO.git" "refs/tags/$tag" >/dev/null 2>&1; do
            tag="cn-zlabs-v$up_date.$revision"
            revision=$((revision + 1))
          done
          cat > release-notes.md <<EOF
          MiSTerFPGA.cn 中文版，基于 $up_date (UTC) 的官方上游更新。

          上游源码：$up
          中文源码：$cn
          固定字库 SHA-256：$(sha256sum dist/misterfpga.cn | cut -d' ' -f1)

          已通过工作流中的测试和 ARM 交叉编译；本次构建尚未经过实体 MiSTer 复测。
          请先备份原有 MiSTer，再将本发布的 MiSTer 和 misterfpga.cn 一同放到 SD 卡根目录。
          在 MiSTer.ini 中设置 osd_language=0 可切回英文界面。

          标签指向中文源码；upstream-merge.patch 记录构建时合入的上游改动。
          manifest.txt 提供构建来源与文件散列。
          EOF
          gh release create "$tag" dist/MiSTer dist/misterfpga.cn \
            dist/LICENSE-OFL dist/LICENSE-MISTER dist/coverage.json \
            dist/manifest.txt dist/preview.pgm dist/upstream-merge.patch \
            --target "$cn" --title "MiSTerFPGA.cn 中文版 v${up_date}${tag#cn-zlabs-v$up_date}" \
            --notes-file release-notes.md
